<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#160f0b" />

    <!-- Favicon / App Icon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO -->
    <title>Bowen Records | Vintage Vinyl & Rare Classic Records</title>
    <meta
      name="description"
      content="Bowen Records is a retro online record shop for vintage vinyl, rare finds, classic albums, and crate-digging collectors."
    />

    <!-- Open Graph / Link Preview -->
    <meta
      property="og:title"
      content="Bowen Records | Vintage Vinyl & Rare Classic Records"
    />
    <meta
      property="og:description"
      content="Dig through vintage vinyl, rare finds, classic albums, and old-school records from Bowen Records."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-site-url.vercel.app" />
    <meta
      property="og:image"
      content="https://your-site-url.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Link Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bowen Records | Vintage Vinyl & Rare Classic Records"
    />
    <meta
      name="twitter:description"
      content="A retro online record shop for vintage vinyl, rare finds, classic albums, and crate-digging collectors."
    />
    <meta
      name="twitter:image"
      content="https://your-site-url.vercel.app/og-image.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
